<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun With Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'MedievalSharp', cursive;
  background:radial-gradient(ellipse at 50% 0%, #1b2a5e 0%, #0a0a1a 60%, #000 100%);
  color:#f5e6c8; overflow-x:hidden; min-height:100vh;
}

/* ===== screens ===== */
.screen { display:none; min-height:100vh; flex-direction:column;
  align-items:center; justify-content:center; position:relative;
  padding:30px; animation:fadeIn .8s; }
.screen.active { display:flex; }
@keyframes fadeIn { from{opacity:0; transform:scale(1.03);} to{opacity:1; transform:none;} }

/* ===== twinkling stars ===== */
.stars { position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 20% 30%, #fff, transparent),
    radial-gradient(2px 2px at 70% 60%, #ffd700, transparent),
    radial-gradient(1px 1px at 40% 80%, #fff, transparent),
    radial-gradient(2px 2px at 85% 20%, #7df9ff, transparent),
    radial-gradient(1px 1px at 10% 70%, #fff, transparent),
    radial-gradient(2px 2px at 55% 15%, #fff, transparent);
  animation:twinkle 4s ease-in-out infinite alternate; }
@keyframes twinkle { from{opacity:.4;} to{opacity:1;} }

/* ===== titles ===== */
.rpg-title {
  font-family:'Cinzel Decorative', serif;
  font-size:clamp(2rem, 6vw, 4.5rem);
  background:linear-gradient(90deg,#ffd700,#fff3b0,#ffd700);
  background-size:200%;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
  text-align:center; letter-spacing:3px;
  filter:drop-shadow(0 0 15px rgba(255,215,0,.5));
}
@keyframes shine { to{background-position:-200% 0;} }
.rpg-title.small { font-size:clamp(1.4rem, 4vw, 2.8rem); }
.subtitle { margin:15px 0 35px; color:#7df9ff; font-size:1.2rem;
  animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 50%{opacity:.5;} }

/* ===== buttons ===== */
.rpg-btn {
  font-family:'Orbitron', sans-serif;
  font-size:1.1rem; letter-spacing:2px;
  padding:14px 42px; border:2px solid #ffd700;
  border-radius:12px; cursor:pointer;
  background:linear-gradient(#2a1a4a,#141033);
  color:#ffd700; transition:.3s; text-transform:uppercase;
  box-shadow:0 0 15px rgba(255,215,0,.3), inset 0 0 12px rgba(255,215,0,.1);
}
.rpg-btn:hover { transform:scale(1.07) translateY(-3px);
  box-shadow:0 0 30px rgba(255,215,0,.7); background:linear-gradient(#3d2a6e,#1d1748); }
.rpg-btn.back { margin-top:35px; border-color:#7df9ff; color:#7df9ff; }
.back:hover { box-shadow:0 0 30px rgba(125,249,255,.6); }

/* ===== character cards ===== */
.cards { display:flex; gap:35px; flex-wrap:wrap; justify-content:center; }
.card {
  width:230px; padding:22px; border-radius:18px; cursor:pointer;
  background:linear-gradient(160deg, rgba(40,30,80,.85), rgba(10,10,30,.9));
  border:2px solid transparent; transition:.35s; text-align:center;
  animation:float 3s ease-in-out infinite;
}
.card:nth-child(2){ animation-delay:.4s; }
.card:nth-child(3){ animation-delay:.8s; }
@keyframes float { 50%{ transform:translateY(-12px);} }
.card img { width:150px; height:150px; object-fit:cover;
  border-radius:50%; border:3px solid #ffd700;
  box-shadow:0 0 20px rgba(255,215,0,.4); transition:.3s; }
.card h2 { font-family:'Cinzel Decorative', serif; color:#ffd700; margin:12px 0 4px; }
.card .tag { color:#7df9ff; font-size:.95rem; margin-bottom:14px; }
.card:hover { transform:scale(1.06) translateY(-8px); border-color:#ffd700;
  box-shadow:0 0 35px rgba(255,215,0,.35); }
.card:hover img { box-shadow:0 0 40px rgba(255,215,0,.8); }
.play-btn { width:100%; padding:10px; font-size:.95rem; }

/* ===== GAME SCREEN ===== */
#gameScreen { padding:10px; }
#wrap { position:relative; }
canvas { display:block; border:4px solid #ffd700; border-radius:14px;
  box-shadow:0 0 40px rgba(255,215,0,.4); max-width:95vw; }

.overlay { position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px;
  background:rgba(5,5,20,.75); backdrop-filter:blur(4px);
  border-radius:14px; }
.overlay h1 { font-family:'Orbitron', sans-serif; color:#ff3b3b; font-size:2.4rem;
  border:3px solid #ff3b3b; padding:14px 30px; border-radius:12px;
  animation:shake .4s infinite; text-shadow:0 0 20px #ff3b3b; text-align:center; }
@keyframes shake { 25%{transform:rotate(1.5deg);} 75%{transform:rotate(-1.5deg);} }
.overlay .fscore { color:#ffd700; font-size:1.5rem; font-family:'Orbitron',sans-serif; }
.btn { font-family:'Orbitron', sans-serif; padding:12px 34px; font-size:1.05rem;
  border:2px solid #ffd700; border-radius:10px; cursor:pointer;
  background:linear-gradient(#2a1a4a,#141033); color:#ffd700; transition:.3s; }
.btn:hover { transform:scale(1.08); box-shadow:0 0 25px rgba(255,215,0,.7); }
.btn.home { border-color:#7df9ff; color:#7df9ff; }

#scoreHud { position:absolute; top:14px; left:50%; transform:translateX(-50%);
  font-family:'Orbitron', sans-serif; color:#fff; font-size:1.6rem;
  text-shadow:0 0 10px #000, 0 0 20px #ffd700; pointer-events:none; z-index:2; }
#clickToPlay { position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; cursor:pointer; z-index:3;
  font-family:'Orbitron', sans-serif; color:#ffd700; font-size:1.8rem;
  text-shadow:0 0 15px #000; animation:pulse 1.2s infinite; }
.hidden { display:none !important; }
</style>
</head>
<body>
<div class="stars"></div>

<!-- ================= HOME ================= -->
<section id="home" class="screen active">
  <h1 class="rpg-title">FUN WITH FRIENDS</h1>
  <p class="subtitle">⚔ Enter the Realm of Three Heroes ⚔</p>
  <button class="rpg-btn" onclick="show('select')">▶ PLAY GAME</button>
</section>

<!-- ================= SELECT ================= -->
<section id="select" class="screen">
  <h1 class="rpg-title small">CHOOSE U WANT PERSONAL</h1>
  <div class="cards" style="margin-top:35px;">
    <div class="card" onclick="pick('shadin')">
      <img src="shadin.png" alt="Shadin">
      <h2>SHADIN</h2><p class="tag">🔥 The Flame Knight</p>
      <button class="rpg-btn play-btn">PLAY</button>
    </div>
    <div class="card" onclick="pick('ashmil')">
      <img src="ashmil.png" alt="Ashmil">
      <h2>ASHMIL</h2><p class="tag">⚡ Storm Warrior</p>
      <button class="rpg-btn play-btn">PLAY</button>
    </div>
    <div class="card" onclick="pick('shifin')">
      <img src="shifin.png" alt="Shifin">
      <h2>SHIFIN</h2><p class="tag">🌙 Shadow Mage</p>
      <button class="rpg-btn play-btn">PLAY</button>
    </div>
  </div>
  <button class="rpg-btn back" onclick="show('home')">◀ HOME</button>
</section>

<!-- ================= GAME ================= -->
<section id="gameScreen" class="screen">
  <div id="wrap">
    <canvas id="cv" width="420" height="620"></canvas>
    <div id="scoreHud">SCORE: 0</div>
    <div id="clickToPlay" class="hidden">CLICK TO PLAY</div>
    <div id="playScreen" class="overlay" style="display:none;">
      <div class="fscore" id="finalScore"></div>
      <h1>YOU ARE DEAD</h1>
      <button class="btn" onclick="restart()">PLAY AGAIN</button>
      <button class="btn home" onclick="show('select')">HOME</button>
    </div>
  </div>
</section>

<script>
/* ================= SCREEN NAV ================= */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id !== 'gameScreen') resetGame();
}
function pick(hero){ HERO = hero; loadAssets(); show('gameScreen'); }

/* ================= ASSETS PER HERO ================= */
let HERO = 'shadin';
let birdImg = new Image(), headImg = new Image();
let sJump, hit1, hit2;

function loadAssets(){
  birdImg = new Image(); birdImg.src = HERO + '.png';
  headImg = new Image(); headImg.src = HERO + 'head.png';
  sJump = new Audio(HERO + 'jump.mp3');
  hit1  = new Audio(HERO + 'hit1.mp3');
  hit2  = new Audio(HERO + 'hit2.mp3');
}

/* ================= FLAPPY GAME ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const GRAVITY = 0.28, FLAP = -6.2, PIPE_SPEED = 1.8, PIPE_GAP = 170, PIPE_W = 62;
let bird, pipes, score, playing, started, dead, frame = 0, hitFlash = 0, lastHit = 1;

function resetGame(){
  bird = { x:90, y:H/2, vy:0, size:44, angle:0 };
  pipes = []; score = 0; playing = false; started = false; dead = false; frame = 0;
  document.getElementById('scoreHud').textContent = 'SCORE: 0';
  document.getElementById('playScreen').style.display = 'none';
  document.getElementById('clickToPlay').classList.remove('hidden');
}

function flap(){
  bird.vy = FLAP;
  try { sJump.currentTime = 0; sJump.play(); } catch(e){}
}
function startGame(){
  document.getElementById('clickToPlay').classList.add('hidden');
  playing = true; started = true;
}
function die(){
  dead = true; playing = false;
  try {
    if (lastHit === 1){ hit1.currentTime = 0; hit1.play(); lastHit = 2; }
    else { hit2.currentTime = 0; hit2.play(); lastHit = 1; }
  } catch(e){}
  hitFlash = 12;
  document.getElementById('finalScore').textContent = 'SCORE: ' + score;
  document.getElementById('playScreen').style.display = 'flex';
}
function restart(){ resetGame(); startGame(); }

function update(){
  if (!playing || dead) return;
  frame++;
  bird.vy += GRAVITY; bird.y += bird.vy;
  bird.angle = Math.min(Math.PI/2, Math.max(-0.5, bird.vy * 0.08));
  if (bird.y + bird.size > H - 40 || bird.y < -20){ die(); return; }
  if (frame % 110 === 0){
    const topH = 90 + Math.random() * (H - PIPE_GAP - 220);
    pipes.push({ x: W + 20, top: topH, passed: false });
  }
  for (const p of pipes){
    p.x -= PIPE_SPEED;
    if (bird.x + bird.size*0.7 > p.x && bird.x + bird.size*0.3 < p.x + PIPE_W &&
        (bird.y < p.top || bird.y + bird.size > p.top + PIPE_GAP)){ die(); return; }
    if (!p.passed && p.x + PIPE_W < bird.x){
      p.passed = true; score++;
      document.getElementById('scoreHud').textContent = 'SCORE: ' + score;
    }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > -10);
}

function draw(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1b2a5e'); g.addColorStop(.6,'#3a2a6e'); g.addColorStop(1,'#0a0a1a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (let i=0;i<25;i++){
    const sx = (i*137 - frame*0.3) % W, sy = (i*89) % (H-100);
    ctx.fillRect((sx+W)%W, sy, 2, 2);
  }

  ctx.fillStyle = '#2a4a2a'; ctx.fillRect(0, H-40, W, 40);
  ctx.fillStyle = '#ffd700';
  for (let i=0;i<W/30;i++){
    const gx = (i*30 - frame*PIPE_SPEED % 30 + 30) % (W+30) - 30;
    ctx.fillRect(gx, H-40, 20, 4);
  }

  for (const p of pipes){
    const pg = ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
    pg.addColorStop(0,'#7a3fa0'); pg.addColorStop(.5,'#b06ee0'); pg.addColorStop(1,'#5a2a80');
    ctx.fillStyle = pg;
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x, p.top + PIPE_GAP, PIPE_W, H - p.top - PIPE_GAP - 40);
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
    ctx.strokeRect(p.x, 0, PIPE_W, p.top);
    ctx.strokeRect(p.x, p.top + PIPE_GAP, PIPE_W, H - p.top - PIPE_GAP - 40);
  }

  // body rotates, head stays upright following bird
  ctx.save();
  ctx.translate(bird.x + bird.size/2, bird.y + bird.size/2);
  ctx.rotate(bird.angle);
  if (birdImg.complete && birdImg.naturalWidth)
    ctx.drawImage(birdImg, -bird.size/2, -bird.size/2, bird.size, bird.size);
  ctx.restore();
  if (headImg.complete && headImg.naturalWidth)
    ctx.drawImage(headImg, bird.x + 2, bird.y - 8, bird.size*0.7, bird.size*0.7);

  if (hitFlash > 0){
    ctx.fillStyle = `rgba(255,0,0,${hitFlash/20})`;
    ctx.fillRect(0,0,W,H); hitFlash--;
  }
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }

/* input */
document.getElementById('clickToPlay').addEventListener('click', startGame);
window.addEventListener('click', e => {
  if (!document.getElementById('gameScreen').classList.contains('active')) return;
  if (e.target.closest('.btn')) return;
  if (!started) startGame(); else if (playing && !dead) flap();
});
window.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  if (!document.getElementById('gameScreen').classList.contains('active')) return;
  e.preventDefault();
  if (!started) startGame(); else if (playing && !dead) flap();
});

resetGame(); loop();
</script>
</body>
</html>
